<!DOCTYPE html> 
<html lang="en"> <head><meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Student Registration Form</title> </head> 
<body> 
    <h1>Student Registration Form</h1> 
    
    <form action="#" method="post"> 
        
        <!-- Text Input --> 
        <label for="firstName">First Name:</label> 
        <input type="text" id="firstName" name="firstName" placeholder="Enter 
your first name"> 
        <br><br> 
        
        <label for="lastName">Last Name:</label> 
        <input type="text" id="lastName" name="lastName" placeholder="Enter 
your last name"> 
        <br><br> 
        
        <!-- Email Input --> 
        <label for="email">Email Address:</label> 
        <input type="email" id="email" name="email" placeholder="Enter your 
email"> 
        <br><br> 
        
        <!-- Password Input --> 
        <label for="password">Password:</label> 
        <input type="password" id="password" name="password" 
placeholder="Create a password"> 
        <br><br> 
 
 
        
        <!-- Number Input --> 
        <label for="age">Age:</label> 
        <input type="number" id="age" name="age" min="16" max="100" 
placeholder="Enter your age"> 
        <br><br> 
        
        <!-- Telephone Input --> 
        <label for="phone">Phone Number:</label> 
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone 
number"> 
        <br><br> 
        
        <!-- Date Input --> 
        <label for="birthdate">Date of Birth:</label> 
        <input type="date" id="birthdate" name="birthdate"> 
        <br><br> 
        
        <!-- Time Input --> 
        <label for="preferredTime">Preferred Class Time:</label> 
        <input type="time" id="preferredTime" name="preferredTime"> 
        <br><br> 
        
        <!-- DateTime Local Input --> 
        <label for="enrollmentDateTime">Enrollment Date & Time:</label> 
        <input type="datetime-local" id="enrollmentDateTime" 
name="enrollmentDateTime"> 
        <br><br> 
        
        <!-- Dropdown/Select Box --> 
        <label for="course">Select Course:</label> 
        <select id="course" name="course"> 
            <option value="">Choose a course</option> 
            <option value="computer-science">Computer Science</option> 
            <option value="mathematics">Mathematics</option> 
            <option value="physics">Physics</option> 
            <option value="chemistry">Chemistry</option> 
            <option value="biology">Biology</option> 
            <option value="english">English Literature</option> 
            <option value="history">History</option> 
        </select> 
 
 
        <br><br> 
        
        <!-- Radio Buttons --> 
        
            <legend>Gender:</legend> 
            <input type="radio" id="male" name="gender" value="male"> 
            <label for="male">Male</label><br> 
            
            <input type="radio" id="female" name="gender" value="female"> 
            <label for="female">Female</label><br> 
            
            <input type="radio" id="other" name="gender" value="other"> 
            <label for="other">Other</label><br> 
      
        <br> 
        
        <!-- Checkboxes --> 
        
            <legend>Interests (Select all that apply):</legend> 
            <input type="checkbox" id="sports" name="interests" value="sports"> 
            <label for="sports">Sports</label><br> 
            
            <input type="checkbox" id="music" name="interests" value="music"> 
            <label for="music">Music</label><br> 
            
            <input type="checkbox" id="arts" name="interests" value="arts"> 
            <label for="arts">Arts</label><br> 
            
            <input type="checkbox" id="technology" name="interests" 
value="technology"> 
            <label for="technology">Technology</label><br> 
            
            <input type="checkbox" id="reading" name="interests" 
value="reading"> 
            <label for="reading">Reading</label><br> 
        
        <br> 
        
        <!-- Search Input --> 
        <label for="searchSkills">Search for Skills:</label> 
 
 
        <input type="search" id="searchSkills" name="searchSkills" 
placeholder="Search for your skills"> 
        <br><br> 
        
        <!-- Range Slider --> 
        <label for="experience">Programming Experience (0-10 years):</label> 
        <input type="range" id="experience" name="experience" min="0" max="10" 
value="0"> 
        <span>0 years</span> 
        <br><br> 
        
        <!-- Color Picker --> 
        <label for="favoriteColor">Favorite Color:</label> 
        <input type="color" id="favoriteColor" name="favoriteColor" 
value="#0066cc"> 
        <br><br> 
        
        <!-- File Upload --> 
        <label for="profilePhoto">Upload Profile Photo:</label> 
        <input type="file" id="profilePhoto" name="profilePhoto" 
accept="image/*"> 
        <br><br> 
        
 
        <br><br> 
        
        <!-- Hidden Input 
        <input type="hidden" id="formVersion" name="formVersion" value="1.0"> 
        <input type="hidden" id="timestamp" name="timestamp" 
value="2025-09-04"> 
         --> 
        <!-- Submit and Reset Buttons --> 
        <input type="submit" value="Register Now"> 
        <input type="reset" value="Clear Form"> 
        
    </form> 
    
    <br> 
    
</body> 
</html>
